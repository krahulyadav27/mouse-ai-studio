[package]
name = "mouse-ai-studio"
version = "0.1.0"
description = "Mouse AI Studio desktop hardware diagnostics"
authors = ["Mouse AI Studio"]
edition = "2021"

[lib]
name = "mouse_ai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }

